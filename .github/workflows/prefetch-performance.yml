name: Dashboard JSON performance experiment

on:
  push:
    branches: [agent/prefetch-performance]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: prefetch-performance-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  MALLOC_ARENA_MAX: "1"
  MALLOC_MMAP_THRESHOLD_: "131072"
  MALLOC_TRIM_THRESHOLD_: "131072"
  MALLOC_TOP_PAD_: "131072"

jobs:
  prefetch:
    if: github.event_name == 'workflow_dispatch'
    name: Dashboard JSON (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: walltime
            build: -m walltime
          - mode: simulation,memory
            build: -m simulation -m memory
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-16
      - uses: taiki-e/install-action@v2
        with:
          tool: protoc@3.25.3,cargo-codspeed@5.0.2
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: dashboard-json-${{ matrix.mode }}
          cache-targets: "true"
          cache-workspace-crates: "true"
      - uses: actions/checkout@v7
        with:
          repository: oxidezap/whatsapp-rust-esp32
          ref: d603f81d36100f4265531450e21ef39d000c8121
          path: consumer
          persist-credentials: false
      - name: Record source and host
        run: |
          git rev-parse HEAD
          git -C consumer rev-parse HEAD
          sha256sum consumer/src/supervisor/message_log.rs Cargo.lock
          rustc -Vv
          lscpu
      # Both implementations run in the same binary with the same fixture.
      - name: Build dashboard JSON benchmarks
        env:
          BUILD_MODES: ${{ matrix.build }}
        run: |
          git rev-parse HEAD
          cargo codspeed build $BUILD_MODES -p whatsapp-rust --features bench-harness --bench dashboard_json
      - name: Measure dashboard JSON
        uses: CodSpeedHQ/action@f842b9a3ffe213dbb81768fd7f7eeb4dfcf1c369
        with:
          mode: ${{ matrix.mode }}
          runner-version: "5.4.2"
          run: cargo codspeed run -p whatsapp-rust --bench dashboard_json
