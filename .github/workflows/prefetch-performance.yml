name: Prefetch performance experiment

on:
  push:
    branches: [agent/prefetch-performance]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: prefetch-performance-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  MALLOC_ARENA_MAX: "1"
  MALLOC_MMAP_THRESHOLD_: "131072"
  MALLOC_TRIM_THRESHOLD_: "131072"
  MALLOC_TOP_PAD_: "131072"

jobs:
  prefetch:
    name: Prefetch (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: walltime
            build: -m walltime
          - mode: simulation,memory
            build: -m simulation -m memory
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-16
      - uses: taiki-e/install-action@v2
        with:
          tool: protoc@3.25.3,cargo-codspeed@5.0.2
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: prefetch-performance-${{ matrix.mode }}
          cache-targets: "true"
      - name: Record source and host
        run: |
          git rev-parse HEAD
          rustc -Vv
          lscpu
      # CodSpeed groups uploads from this workflow run. Distinct benchmark
      # names keep each pinned production implementation separate in that run.
      - uses: actions/checkout@v7
        if: matrix.mode == 'walltime'
        with:
          ref: f56a47f43d1ff5a5af1f1766a99c8ca987535129
          path: .prefetch-unbounded
          persist-credentials: false
      - name: Build the unbounded reference
        if: matrix.mode == 'walltime'
        working-directory: .prefetch-unbounded
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          git rev-parse HEAD
          sed -i -E 's/^fn (four_external_blobs|eight_clients)\(/fn unbounded_\1(/' benches/appstate_prefetch.rs
          git diff -- benches/appstate_prefetch.rs
          sha256sum Cargo.lock src/client/app_state/prefetch_bench.rs
          cargo codspeed build -m walltime -p whatsapp-rust --features bench-harness --bench appstate_prefetch
      - name: Measure the unbounded reference
        if: matrix.mode == 'walltime'
        uses: CodSpeedHQ/action@f842b9a3ffe213dbb81768fd7f7eeb4dfcf1c369
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        with:
          mode: walltime
          runner-version: "5.4.2"
          working-directory: .prefetch-unbounded
          run: cargo codspeed run -p whatsapp-rust --bench appstate_prefetch
      - uses: actions/checkout@v7
        if: matrix.mode == 'walltime'
        with:
          ref: a2f6bd940cb88bcc4e70f056aad34c5172ec8db8
          path: .prefetch-baseline
          persist-credentials: false
      - name: Build the pinned walltime reference
        if: matrix.mode == 'walltime'
        working-directory: .prefetch-baseline
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          git rev-parse HEAD
          sed -i -E 's/^fn (four_external_blobs|eight_clients|streaming_vec|streaming_accounted)\(/fn reference_\1(/' benches/appstate_prefetch.rs
          git diff -- benches/appstate_prefetch.rs
          sha256sum Cargo.lock src/client/app_state/prefetch_bench.rs
          cargo codspeed build -m walltime -p whatsapp-rust --features bench-harness --bench appstate_prefetch
      - name: Measure the pinned walltime reference
        if: matrix.mode == 'walltime'
        uses: CodSpeedHQ/action@f842b9a3ffe213dbb81768fd7f7eeb4dfcf1c369
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        with:
          mode: walltime
          runner-version: "5.4.2"
          working-directory: .prefetch-baseline
          run: cargo codspeed run -p whatsapp-rust --bench appstate_prefetch
      - name: Build prefetch benchmark
        env:
          BUILD_MODES: ${{ matrix.build }}
        run: cargo codspeed build $BUILD_MODES -p whatsapp-rust --features bench-harness --bench appstate_prefetch
      - name: Measure prefetch
        uses: CodSpeedHQ/action@f842b9a3ffe213dbb81768fd7f7eeb4dfcf1c369
        with:
          mode: ${{ matrix.mode }}
          runner-version: "5.4.2"
          disable-memory-capture-stack: "false"
          disable-memory-track-physical: "false"
          run: cargo codspeed run -p whatsapp-rust --bench appstate_prefetch
