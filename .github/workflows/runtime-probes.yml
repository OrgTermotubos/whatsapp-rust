name: Native runtime probes

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-probes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-probes:
    name: Native latency and global heap
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-16
      - uses: taiki-e/install-action@v2
        with:
          tool: protoc@3.25.3
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: native-runtime-probes
      - name: Test probe executor and output paths
        run: cargo test --locked -p whatsapp-xtask runtime_probes::tests
      - name: Measure authenticated runtime workloads
        run: cargo run --locked --quiet -p whatsapp-xtask -- ci runtime-probes --out-dir runtime-probe-results
      - name: Preserve samples and failure logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-runtime-probes-${{ github.sha }}
          path: runtime-probe-results
          if-no-files-found: error
