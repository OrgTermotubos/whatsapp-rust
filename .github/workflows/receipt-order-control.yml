name: Receipt ordering control
on:
  push:
    branches: [agent/receipt-order-control]
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
jobs:
  receipts:
    name: Receipt observer (${{ matrix.source }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: baseline
            sha: 135e1aebf9d62c06da17ae4516a90554a472c60e
          - source: candidate
            sha: a85d3d807f16e5ffab48217e3d11a5fdd8876e84
    services:
      mock-server:
        image: ghcr.io/whiskeysockets-devtools/bartender@sha256:9f3a49dd9f944414fbda50571bba5f66f2ab6fdc48001e6803d4c09a1042c78e
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.BARTENDER_GHCR_TOKEN }}
        ports:
          - 8080:8080
        env:
          CHATSTATE_TTL_SECS: "3"
        options: >-
          --log-driver local
          --log-opt max-size=10m
          --log-opt max-file=1
          --log-opt compress=false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select exact production source and add observer only to the test
        env:
          SOURCE_SHA: ${{ matrix.sha }}
        run: |
          cp .ci/receipt-order-observer.patch "$RUNNER_TEMP/receipt-order-observer.patch"
          git checkout --detach "$SOURCE_SHA"
          git apply "$RUNNER_TEMP/receipt-order-observer.patch"
          git rev-parse HEAD
          git diff --stat
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-16
      - uses: taiki-e/install-action@v2
        with:
          tool: protoc@3.25.3,cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "true"
      - name: Wait for mock
        run: cargo xt ci workflow wait-for-mock
      - name: Repeat all four original disconnect cases twenty times
        env:
          MOCK_SERVER_URL: wss://127.0.0.1:8080/ws/chat
          RUST_LOG: warn
        run: cargo nextest run --locked --profile e2e -p e2e-tests --test concurrent_disconnect --stress-count 20 --no-fail-fast --success-output immediate
