name: PR1698 paired performance qualification

on:
  push:
    branches: [perf/pr1698-paired-dabf1100]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: pr1698-paired-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  PROTOC_VERSION: "3.25.3"
  MALLOC_ARENA_MAX: "1"
  MALLOC_MMAP_THRESHOLD_: "131072"
  MALLOC_TRIM_THRESHOLD_: "131072"
  MALLOC_TOP_PAD_: "131072"

jobs:
  paired:
    if: ${{ github.ref == 'refs/heads/perf/pr1698-paired-dabf1100' }}
    name: Paired mainfb970318 and candidatedabf1100 CPU and lifecycle memory
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: never
      CARGO_TARGET_DIR: ${{ github.workspace }}/paired-target
      MALLOC_ARENA_MAX: "1"
      MALLOC_MMAP_THRESHOLD_: "131072"
      MALLOC_TRIM_THRESHOLD_: "131072"
      MALLOC_TOP_PAD_: "131072"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # CodSpeed's GitHub provider reads GITHUB_WORKSPACE for upload identity.
      - name: Checkout the pinned baseline upload identity at workspace root
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fb970318c4dd47898a18ad6212ae17a4f530385b
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fb970318c4dd47898a18ad6212ae17a4f530385b
          path: main-control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: joaomdsferro/whatsapp-rust
          ref: dabf1100ab27ee2152f7be8a4c02e66e1f8c57fc
          path: candidate
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f0d5300ba8908d942c808f4d31c08471d7798ba3 # nightly
        with:
          toolchain: nightly-2026-06-16
      - name: Prepare pinned runner before either measurement
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/paired-codspeed" "$RUNNER_TEMP/paired-tools/bin"
          curl --fail --location --retry 2 --max-time 120 -o "$RUNNER_TEMP/paired-tools/bin/cargo-codspeed" https://github.com/CodSpeedHQ/codspeed-rust/releases/download/v5.0.1/cargo-codspeed-x86_64-unknown-linux-musl
          echo "df4b2618fda2aa19f8b92e8d745548a49d9ce20785472eeb584fdc2c99624395  $RUNNER_TEMP/paired-tools/bin/cargo-codspeed" | sha256sum --check
          chmod +x "$RUNNER_TEMP/paired-tools/bin/cargo-codspeed"
          curl --fail --location --retry 2 --max-time 120 -o "$RUNNER_TEMP/paired-tools/protoc.zip" https://github.com/protocolbuffers/protobuf/releases/download/v25.3/protoc-25.3-linux-x86_64.zip
          echo "f853e691868d0557425ea290bf7ba6384eef2fa9b04c323afab49a770ba9da80  $RUNNER_TEMP/paired-tools/protoc.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/paired-tools/protoc.zip" -d "$RUNNER_TEMP/paired-tools/protobuf"
          echo "$RUNNER_TEMP/paired-tools/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/paired-tools/protobuf/bin" >> "$GITHUB_PATH"
          curl --fail --location --retry 2 --max-time 120 -o "$RUNNER_TEMP/paired-codspeed/runner.tar.gz" https://github.com/CodSpeedHQ/codspeed/releases/download/v5.2.0/codspeed-runner-x86_64-unknown-linux-musl.tar.gz
          echo "22919a3a9324eee016548cbe6f29b5665f8dec57091461f803c9a918533e375f  $RUNNER_TEMP/paired-codspeed/runner.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/paired-codspeed/runner.tar.gz" -C "$RUNNER_TEMP/paired-codspeed"
          echo "$RUNNER_TEMP/paired-codspeed/codspeed-runner-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Verify identities and add identical measured lifecycle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C main-control rev-parse HEAD)" = fb970318c4dd47898a18ad6212ae17a4f530385b
          test "$(git -C candidate rev-parse HEAD)" = dabf1100ab27ee2152f7be8a4c02e66e1f8c57fc
          cmp main-control/Cargo.toml candidate/Cargo.toml
          cmp main-control/Cargo.lock candidate/Cargo.lock
          cmp main-control/rust-toolchain.toml candidate/rust-toolchain.toml
          cmp main-control/benches/connected_idle.rs candidate/benches/connected_idle.rs
          cmp main-control/src/bench_support/connected_idle.rs candidate/src/bench_support/connected_idle.rs
          cmp main-control/benches/client_receive.rs candidate/benches/client_receive.rs
          cmp main-control/src/bench_support.rs candidate/src/bench_support.rs
          cat > "$RUNNER_TEMP/fullcycle.rs" <<'RS'
          // Paired control: retain the entire client lifecycle inside the measured region.
          #[divan::bench(args = [false, true], sample_count = 1, sample_size = 1)]
          fn complete_client_activity(bencher: divan::Bencher, sqlite: bool) {
              bencher.bench_local(|| {
                  let rt = runtime();
                  rt.block_on(async {
                      let backend = if sqlite {
                          BackendFixture::sqlite().await.expect("real SQLite backend")
                      } else {
                          BackendFixture::memory()
                      };
                      let session = Session::connect(backend.backend()).await.expect("connect");
                      let activity = session.prepare_activity().await.expect("prepare activity");
                      session.receive_activity(activity).await.expect("activity");
                      session.shutdown().await.expect("shutdown");
                      backend.cleanup().expect("cleanup");
                  });
                  drop(rt);
              });
          }
          RS
          cat "$RUNNER_TEMP/fullcycle.rs" >> main-control/benches/connected_idle.rs
          cat "$RUNNER_TEMP/fullcycle.rs" >> candidate/benches/connected_idle.rs
          cmp main-control/benches/connected_idle.rs candidate/benches/connected_idle.rs
          mkdir -p reports
          # Each workflow is one CodSpeed run; keep both sides' benchmark URIs unique.
          for name in activity_peak cache_maintenance_after_activity complete_client_activity; do
            sed -i "s/^fn ${name}(/fn base_fb970318_${name}(/" main-control/benches/connected_idle.rs
            sed -i "s/^fn ${name}(/fn head_dabf1100_${name}(/" candidate/benches/connected_idle.rs
          done
          test "$(grep -c '^fn base_fb970318_' main-control/benches/connected_idle.rs)" -eq 3
          test "$(grep -c '^fn head_dabf1100_' candidate/benches/connected_idle.rs)" -eq 3
          sed 's/^fn base_fb970318_/fn /' main-control/benches/connected_idle.rs > reports/main-normalized-workload.rs
          sed 's/^fn head_dabf1100_/fn /' candidate/benches/connected_idle.rs > reports/candidate-normalized-workload.rs
          cmp reports/main-normalized-workload.rs reports/candidate-normalized-workload.rs
          for name in dm_receive group_receive dm_receive_burst group_receive_burst plaintext_ownership_controls worker_lane_creation worker_lanes_warm worker_hot_burst_warm worker_lanes; do
            sed -i "s/^fn ${name}(/fn base_fb970318_${name}(/" main-control/benches/client_receive.rs
            sed -i "s/^fn ${name}(/fn head_dabf1100_${name}(/" candidate/benches/client_receive.rs
          done
          test "$(grep -c '^fn base_fb970318_' main-control/benches/client_receive.rs)" -eq 9
          test "$(grep -c '^fn head_dabf1100_' candidate/benches/client_receive.rs)" -eq 9
          sed 's/^fn base_fb970318_/fn /' main-control/benches/client_receive.rs > reports/main-normalized-receive.rs
          sed 's/^fn head_dabf1100_/fn /' candidate/benches/client_receive.rs > reports/candidate-normalized-receive.rs
          cmp reports/main-normalized-receive.rs reports/candidate-normalized-receive.rs
          cat > reports/benchmark-sha-map.json <<'JSON'
          {
            "kind": "single paired qualification run; compare labels, not this run's aggregate commit",
            "base_fb970318_": "fb970318c4dd47898a18ad6212ae17a4f530385b",
            "head_dabf1100_": "dabf1100ab27ee2152f7be8a4c02e66e1f8c57fc",
            "canonical_cases": ["activity_peak", "cache_maintenance_after_activity", "complete_client_activity", "dm_receive", "dm_receive_burst", "group_receive", "group_receive_burst", "plaintext_ownership_controls", "worker_lane_creation", "worker_lanes_warm", "worker_hot_burst_warm", "worker_lanes"],
            "arguments": [false, true],
            "instruments": ["Simulation", "Memory"]
          }
          JSON
          {
            uname -a
            rustc -Vv
            ldd --version
            sha256sum main-control/rust-toolchain.toml candidate/rust-toolchain.toml main-control/Cargo.toml candidate/Cargo.toml main-control/Cargo.lock candidate/Cargo.lock main-control/benches/connected_idle.rs candidate/benches/connected_idle.rs
          } > reports/environment.txt
          printf 'RUSTFLAGS=%s\nCARGO_ENCODED_RUSTFLAGS=%s\n' "${RUSTFLAGS-}" "${CARGO_ENCODED_RUSTFLAGS-}" > reports/compiler-flags.txt
          printf 'codspeed build injects --cfg=codspeed -Cdebuginfo=2 -Cstrip=none; bench profile inherited from identical manifests\n' >> reports/compiler-flags.txt
      # Remote-only prerequisite, matching the existing CodSpeed CI instruments.
      # Run this qualification only on the disposable CI runner.
      - name: Finish instrument setup on the disposable CI runner
        run: codspeed setup --mode simulation,memory
      - name: Build main control
        working-directory: main-control
        run: cargo codspeed build --locked -p whatsapp-rust --features bench-harness --bench connected_idle --bench client_receive -m simulation -m memory -j2
      - name: Measure main control with isolated raw profiles
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git -C main-control rev-parse HEAD)"
          git rev-parse HEAD > reports/main-upload-sha.txt
          git -C main-control rev-parse HEAD > reports/main-sha.txt
          codspeed --version > reports/main-tools.txt
          cargo_version_status=0
          cargo codspeed --version > reports/main-cargo-version.txt 2>&1 || cargo_version_status=$?
          test "$cargo_version_status" -le 1
          grep -Fx 'cargo-codspeed 5.0.1' reports/main-cargo-version.txt >> reports/main-tools.txt
          printf '%s\n' "$cargo_version_status" > reports/main-cargo-version-exit.txt
          ldd --version > reports/main-libc.txt
          codspeed run --mode simulation,memory --working-directory main-control --profile-folder "$GITHUB_WORKSPACE/reports/main-profiles" -- cargo codspeed run -p whatsapp-rust --bench connected_idle --bench client_receive 2>&1 | tee reports/main-run.log
          codspeed status >> reports/main-tools.txt
      - name: Preserve main build metadata
        run: find paired-target -type f -name "connected_idle*" -print -exec sha256sum {} \; > reports/main-artifacts.txt
      - name: Verify tool and libc state before candidate build
        shell: bash
        run: |
          set -euo pipefail
          ldd --version > reports/before-candidate-libc.txt
          cmp reports/main-libc.txt reports/before-candidate-libc.txt
          codspeed --version
          cargo_version_status=0
          cargo codspeed --version > reports/before-candidate-cargo-version.txt 2>&1 || cargo_version_status=$?
          test "$cargo_version_status" -le 1
          grep -Fx 'cargo-codspeed 5.0.1' reports/before-candidate-cargo-version.txt
      - name: Align the root upload identity with the pinned candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 https://github.com/joaomdsferro/whatsapp-rust.git dabf1100ab27ee2152f7be8a4c02e66e1f8c57fc
          git checkout --detach dabf1100ab27ee2152f7be8a4c02e66e1f8c57fc
          test "$(git rev-parse HEAD)" = "$(git -C candidate rev-parse HEAD)"
          cmp Cargo.toml candidate/Cargo.toml
          cmp Cargo.lock candidate/Cargo.lock
      - name: Build candidate on the same host and target
        working-directory: candidate
        run: cargo codspeed build --locked -p whatsapp-rust --features bench-harness --bench connected_idle --bench client_receive -m simulation -m memory -j2
      - name: Measure candidate with isolated raw profiles
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git -C candidate rev-parse HEAD)"
          git rev-parse HEAD > reports/candidate-upload-sha.txt
          git -C candidate rev-parse HEAD > reports/candidate-sha.txt
          codspeed --version > reports/candidate-tools.txt
          cargo_version_status=0
          cargo codspeed --version > reports/candidate-cargo-version.txt 2>&1 || cargo_version_status=$?
          test "$cargo_version_status" -le 1
          grep -Fx 'cargo-codspeed 5.0.1' reports/candidate-cargo-version.txt >> reports/candidate-tools.txt
          printf '%s\n' "$cargo_version_status" > reports/candidate-cargo-version-exit.txt
          ldd --version > reports/candidate-libc.txt
          codspeed run --mode simulation,memory --working-directory candidate --profile-folder "$GITHUB_WORKSPACE/reports/candidate-profiles" -- cargo codspeed run -p whatsapp-rust --bench connected_idle --bench client_receive 2>&1 | tee reports/candidate-run.log
          codspeed status >> reports/candidate-tools.txt
      - name: Check the same executor versions
        shell: bash
        run: |
          set -euo pipefail
          cmp reports/main-tools.txt reports/candidate-tools.txt
          cmp reports/main-libc.txt reports/candidate-libc.txt
      - name: Preserve candidate build metadata
        run: find paired-target -type f -name "connected_idle*" -print -exec sha256sum {} \; > reports/candidate-artifacts.txt
      - name: Bound retained reports to 128 MiB
        id: report-size
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # Measurements are already uploaded; retain their raw profiles losslessly.
          find reports/main-profiles reports/candidate-profiles -type f -size +1M ! -name '*.gz' -exec gzip -6 {} +
          find reports/main-profiles reports/candidate-profiles -type f -name '*.gz' -exec gzip -t {} +
          total=$(du -sb reports main-control/benches/connected_idle.rs candidate/benches/connected_idle.rs main-control/benches/client_receive.rs candidate/benches/client_receive.rs | awk '{sum += $1} END {print sum}')
          if [ "$total" -gt 134217728 ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Report retention budget exceeded: $total bytes" >&2
            exit 1
          fi
          echo "allowed=true" >> "$GITHUB_OUTPUT"
      - name: Preserve measurement sources and environment
        if: ${{ always() && steps.report-size.outputs.allowed == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: paired-connected-lifecycle-source-environment
          retention-days: 3
          if-no-files-found: error
          path: |
            reports
            main-control/benches/connected_idle.rs
            candidate/benches/connected_idle.rs
            main-control/benches/client_receive.rs
            candidate/benches/client_receive.rs
